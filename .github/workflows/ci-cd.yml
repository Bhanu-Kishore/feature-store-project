name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build dataset, features and Feast online store
        run: |
          python prepare_data.py
          python build_features.py
          python prepare_training_data.py
          python scripts/build_feature_store.py

      - name: Run tests
        run: python -m pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t churn-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t churn-frontend:ci ./frontend

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push backend image to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_LOGIN_SERVER/churn-backend:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" -t "$ACR_LOGIN_SERVER/churn-backend:latest" ./backend
          docker push "$IMAGE"
          docker push "$ACR_LOGIN_SERVER/churn-backend:latest"
          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push frontend image to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          IMAGE="$ACR_LOGIN_SERVER/churn-frontend:${GITHUB_SHA::12}"
          docker build \
            --build-arg "VITE_API_URL=${BACKEND_URL}" \
            -t "$IMAGE" \
            -t "$ACR_LOGIN_SERVER/churn-frontend:latest" \
            ./frontend
          docker push "$IMAGE"
          docker push "$ACR_LOGIN_SERVER/churn-frontend:latest"
          echo "FRONTEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update backend Container App
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE"

      - name: Update frontend Container App
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_APP }}
        run: |
          az containerapp update \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE"

      - name: Smoke-test the public backend
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 15 \
            "${{ vars.BACKEND_URL }}/health"
